<style>

2L128 52'/%3E%3C/g%3E%3Cg fill='%23f6efe0'%3E%3Cellipse cx='72' cy='150' rx='5' ry='9'/%3E%3Cellipse cx='128' cy='150' rx='5' ry='9'/%3E%3Cellipse cx='80' cy='112' rx='4' ry='7'/%3E%3Cellipse cx='120' cy='112' rx='4' ry='7'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right -70px top 70px,left -80px bottom 60px;background-size:250px,220px}
#panel{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--bg);z-index:15;overflow-y:auto;-webkit-overflow-scrolling:touch}#phead{position:sticky;top:0;z-index:2;background:#2f7d4f;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px;font-weight:600}#phead button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:15px}#pbody{max-width:640px;margin:auto;padding:12px 14px calc(28px + env(safe-area-inset-bottom))}.lk{display:inline-block;color:var(--ac);text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
#estado{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;margin:0 -14px;padding:2px 14px 4px;scroll-padding:0 14px}#estado::-webkit-scrollbar{display:none}#estado .pl:only-child{flex-basis:100%}#dots{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--mut)}.pt{width:7px;height:7px;border-radius:50%;background:var(--bd)}.pt.on{background:var(--ac)}.mes{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.mes b{text-transform:capitalize}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}.cal .dw{font-size:12px;color:var(--mut);padding:4px 0}.dia{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:14px;background:var(--bg);cursor:pointer}.dia.a{background:#4a90d9;color:#fff;font-weight:600}.dia.b{background:#e0902f;color:#fff;font-weight:600}.dia.ab{background:linear-gradient(135deg,#4a90d9 50%,#e0902f 50%);color:#fff;font-weight:600}.dia.hoy{box-shadow:0 0 0 2px var(--ac)}.dia.sel{outline:2px solid var(--tx);outline-offset:1px}.leg{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--mut)}.leg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:5px;vertical-align:-1px}
header{background:#2f7d4f;color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:5}
header h1{font-size:19px;margin:0;flex:1}header small{display:block;font-weight:400;font-size:12px;opacity:.85}
header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:10px;padding:8px 11px;font-size:15px}
main{padding:12px 14px;max-width:640px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:13px;color:var(--ac);margin:0 0 10px;text-transform:uppercase;letter-spacing:.05em}
.pl{flex:0 0 84%;scroll-snap-align:center;padding:12px 14px;border-radius:14px;background:var(--bg);border:1px solid var(--bd);cursor:pointer}
.pl.hoy{background:var(--ok)}.pl .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px}.pl .top b{display:block}.pl .l{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--bd);font-size:14px}.ic{background:none;border:0;font-size:19px;padding:2px 6px}.mut{color:var(--mut);font-size:13px}
label{display:block;font-size:13px;color:var(--mut);margin:9px 0 3px}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px}
button.p{width:100%;margin-top:14px;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:16px;font-weight:600}
button.s{width:100%;margin-top:8px;padding:11px;border:1px solid var(--bd);border-radius:12px;background:none;color:var(--tx);font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.ver{font-size:26px;background:none;border:0;padding:4px 8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:13px;border:0;background:none;color:var(--mut);font-size:15px}nav button.on{color:var(--ac);font-weight:700}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;z-index:20;color:#fff;text-align:center}
#modal img{max-width:100%;max-height:72vh;border-radius:10px}
#msg{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));background:#222;color:#fff;padding:12px 14px;border-radius:12px;display:none;z-index:30;font-size:14px}
</style></head><body>
<header><h1>🌱 Mis Plantas<small id="quien"></small></h1>
<button id="b1" onclick="cargar()" hidden>⟳</button><button id="b3" onclick="cambiarOrigen()" hidden>⚙</button><button id="b2" onclick="salir()" hidden>Salir</button></header>
<main id="app"></main>
<nav id="nav" hidden><button id="t1" class="on" onclick="tab(1)">💧 Cuidados</button><button id="t2" onclick="tab(2)">📷 Fotos</button></nav>
<div id="modal" onclick="this.style.display='none'"></div>
<div id="panel" hidden><div id="phead"><button onclick="cerrarPlanta()">‹ Volver</button><span>Historial de la planta</span></div><div id="pbody"></div></div><div id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
/* ====== CONFIGURACIÓN: edita solo estas 3 líneas ====== */
const CONFIG = {
  CLIENT_ID: "430ca364-7d2d-457a-9a5a-9357f291a879",   // ID de aplicación (cliente) de Microsoft
  CARPETA: "Plantas",                        // carpeta de OneDrive que contiene el Excel
  EXCEL: "plantas.xlsx",                     // nombre del Excel
  FOTOS: "fotos_plantas"                     // carpeta de fotos (dentro de CARPETA)
};
/* ====================================================== */
const TIPOS=["Riego","Fertilización","Poda","Trasplante","Plaga/tratamiento","Observación"];
const SCOPES=["Files.ReadWrite.All"],J={"Content-Type":"application/json"};
const S={plantas:[],ubic:{},regs:[],fotos:[],ord:[],histOrd:[]};
let msalApp,account,QUIEN="",busy=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const hoy=()=>new Date().toLocaleDateString("sv-SE");
const enc=p=>p.split("/").map(encodeURIComponent).join("/");
let REF=null; // null = OneDrive propio; {d,i} = carpeta compartida por otra cuenta
const P=rel=>REF?`/drives/${REF.d}/items/${REF.i}:/${enc(rel)}`:`/me/drive/root:/${enc(CONFIG.CARPETA)}/${enc(rel)}`;
const CH=()=>REF?`/drives/${REF.d}/items/${REF.i}/children`:`/me/drive/root:/${enc(CONFIG.CARPETA)}:/children`;
const WB=()=>`${P(CONFIG.EXCEL)}:/workbook`;
const shareId=u=>"u!"+btoa(u).replace(/=+$/,"").replace(/\//g,"_").replace(/\+/g,"-");
const limpio=t=>t.replace(/[^\p{L}\p{N}]/gu,"_");
function aviso(t,err){const m=$("msg");m.textContent=(err?"⚠️ ":"")+t;m.style.display="block";clearTimeout(aviso.t);aviso.t=setTimeout(()=>m.style.display="none",err?6000:3000)}

/* ---------- Microsoft Graph ---------- */
async function token(){
  try{return (await msalApp.acquireTokenSilent({scopes:SCOPES,account})).accessToken}
  catch(e){await msalApp.acquireTokenRedirect({scopes:SCOPES,account});throw e}
}
async function gf(path,opts={}){
  const t=await token();
  const r=await fetch("https://graph.microsoft.com/v1.0"+path,{...opts,headers:{Authorization:"Bearer "+t,...(opts.headers||{})}});
  if(!r.ok){let m="";try{m=(await r.json()).error.message}catch{}
    const e=new Error(m||"Error "+r.status);e.status=r.status;throw e}
  return r;
}
const HEAD={Plantas:["Nombre","Ubicación","Notas"],Registros:["Fecha","Planta","Tipo","Detalle","Quién"],Fotos:["Fecha","Planta","Archivo","Quién","Nota"]};
const XLSX_MIME="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
let pend=0,cola=Promise.resolve();
async function bajar(){
  const [meta,buf]=await Promise.all([gf(P(CONFIG.EXCEL)).then(r=>r.json()),gf(`${P(CONFIG.EXCEL)}:/content`).then(r=>r.arrayBuffer())]);
  const wb=XLSX.read(buf,{type:"array"});
  for(const h in HEAD)if(!wb.Sheets[h])XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([HEAD[h]]),h);
  return {wb,etag:meta.eTag};
}
const serial=iso=>{const[y,m,d]=iso.split("-").map(Number);return Date.UTC(y,m-1,d)/864e5+25569};
/* Descarga el Excel, aplica fn(wb) y lo sube. Si fn devuelve false no se sube nada. */
async function modificar(fn){
  for(let i=0;i<3;i++){
    const {wb,etag}=await bajar();
    if(fn(wb)===false)return wb;
    try{await gf(`${P(CONFIG.EXCEL)}:/content`,{method:"PUT",headers:{"Content-Type":XLSX_MIME,"If-Match":etag},
      body:XLSX.write(wb,{bookType:"xlsx",type:"array"})});return wb}
    catch(e){if(e.status!==412||i===2)throw e} /* 412 = alguien guardó justo antes: se reintenta */
  }
}
function anexar(wb,h,fila){
  const f=[...fila];
  if(h!=="Plantas"&&/^\d{4}-\d{2}-\d{2}$/.test(f[0]))f[0]={t:"n",v:serial(f[0]),z:"yyyy-mm-dd"};
  XLSX.utils.sheet_add_aoa(wb.Sheets[h],[f],{origin:-1});
}
const celda=(ws,R,C)=>{const c=ws[XLSX.utils.encode_cell({r:R,c:C})];return c?c.v:""};
const txtv=(ws,R,C)=>String(celda(ws,R,C)??"");
const setTxt=(ws,R,C,v)=>{ws[XLSX.utils.encode_cell({r:R,c:C})]={t:"s",v}};
function renombrar(w,v,n,ub){
  const pl=w.Sheets.Plantas,rg=XLSX.utils.decode_range(pl["!ref"]);
  for(let R=rg.s.r+1;R<=rg.e.r;R++)if(txtv(pl,R,0)===v){setTxt(pl,R,0,n);setTxt(pl,R,1,ub);break}
  if(n!==v)["Registros","Fotos"].forEach(h=>{const ws=w.Sheets[h],r=XLSX.utils.decode_range(ws["!ref"]);
    for(let R=r.s.r+1;R<=r.e.r;R++)if(txtv(ws,R,1)===v)setTxt(ws,R,1,n)});
}
function eliminarFila(ws,r){
  const rg=XLSX.utils.decode_range(ws["!ref"]);let hit=-1;
  for(let R=rg.e.r;R>rg.s.r;R--){
    if(fechaISO(celda(ws,R,0))===r[0]&&txtv(ws,R,1)===r[1]&&txtv(ws,R,2)===r[2]&&txtv(ws,R,3)===r[3]&&txtv(ws,R,4)===r[4]){hit=R;break}
  }
  if(hit<0)return false; /* ya no existe */
  for(let R=hit;R<rg.e.r;R++)for(let C=rg.s.c;C<=rg.e.c;C++){
    const a=XLSX.utils.encode_cell({r:R,c:C}),b=XLSX.utils.encode_cell({r:R+1,c:C});
    if(ws[b])ws[a]=ws[b];else delete ws[a]}
  for(let C=rg.s.c;C<=rg.e.c;C++)delete ws[XLSX.utils.encode_cell({r:rg.e.r,c:C})];
  rg.e.r--;ws["!ref"]=XLSX.utils.encode_range(rg);
}
function fechaISO(v){
  if(typeof v==="number")return new Date(Math.round((v-25569)*864e5)).toISOString().slice(0,10);
  const s=String(v||"");if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);
  const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);return m?`${m[3]}-${m[2].padStart(2,"0")}-${m[1].padStart(2,"0")}`:null;
}
function filas(v){return v.slice(1).map(r=>{const f=fechaISO(r[0]),a=[...r,"","","","",""];return f&&a[1]?[f,...a.slice(1,5).map(String)]:null}).filter(Boolean)}

function filasWb(wb,h){return filas(XLSX.utils.sheet_to_json(wb.Sheets[h],{header:1,raw:true,defval:""}))}
function leerWb(wb){
  const pl=XLSX.utils.sheet_to_json(wb.Sheets.Plantas,{header:1,raw:true,defval:""}).slice(1).filter(r=>r[0]);
  S.plantas=pl.map(r=>String(r[0]));S.ubic={};pl.forEach(r=>S.ubic[String(r[0])]=String(r[1]||""));
  S.regs=filasWb(wb,"Registros");S.fotos=filasWb(wb,"Fotos");
  try{localStorage.setItem("cache",JSON.stringify({p:S.plantas,u:S.ubic,r:S.regs,f:S.fotos}))}catch{}
}
function cargarCache(){try{const c=JSON.parse(localStorage.getItem("cache")||"null");if(c){S.plantas=c.p;S.ubic=c.u;S.regs=c.r;S.fotos=c.f;pintar()}}catch{}}
const stamp=()=>{$("quien").textContent=`${QUIEN} · actualizado ${new Date().toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"})}`};
function aplicar(wb){if(pend<=1){leerWb(wb);pintar();stamp()}}
async function cargar(sil,force){
  if(sil&&!force&&pend>0)return;
  try{const {wb}=await bajar();leerWb(wb);pintar();stamp()}
  catch(e){if(!sil)aviso(e.status===404?`No se encontró el Excel (${CONFIG.EXCEL}) en la carpeta de OneDrive. Revisa CONFIG o el enlace compartido.`:e.message,true)}
}
/* Guarda en segundo plano y en orden: la pantalla ya se actualizó antes de subir. */
function enSegundoPlano(texto,fn){
  pend++;aviso(texto);
  cola=cola.then(async()=>{
    try{const m=await fn();aviso(typeof m==="string"?m:"Guardado ✓")}
    catch(e){aviso(e.message,true);await cargar(true,true)}
    finally{pend--}
  });
}
async function run(fn){
  if(busy)return;busy=true;aviso("Un momento…");
  try{await fn()}catch(e){aviso(e.message,true)}finally{busy=false}
}

/* ---------- pantalla ---------- */
const ultimo=(p,t)=>S.regs.filter(r=>r[1]===p&&r[2]===t).reduce((m,r)=>!m||r[0]>=m[0]?r:m,null);
const dias=i=>Math.round((Date.parse(hoy())-Date.parse(i))/864e5);
const fmt=i=>new Date(i+"T12:00:00").toLocaleDateString("es",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
function linea(ic,et,u){
  if(!u)return `<div class="l"><span>${ic} ${et}</span><span class="mut">Sin registros</span></div>`;
  const d=dias(u[0]),c=d<0?`en ${-d} d`:d===0?"hoy":d===1?"ayer":`hace ${d} días`;
  return `<div class="l"><span>${ic} ${et}</span><span style="text-align:right"><b>${fmt(u[0])}</b><span class="mut" style="display:block">${c}${u[4]?" · "+esc(u[4]):""}</span></span></div>`;
}
function llenar(id){const s=$(id),v=s.value;
  s.innerHTML=S.plantas.length?S.plantas.map(p=>`<option>${esc(p)}</option>`).join(""):'<option value="">(agrega una planta)</option>';
  if(S.plantas.includes(v))s.value=v}
function pintarPuntos(){
  const est=$("estado"),n=S.plantas.length,w=est.firstElementChild?est.firstElementChild.offsetWidth+10:1;
  const k=Math.min(n-1,Math.max(0,Math.round(est.scrollLeft/w)));
  $("dots").innerHTML=n<2?"":n>10?`${k+1} / ${n}`:S.plantas.map((_,i)=>`<span class="pt${i===k?" on":""}"></span>`).join("");
}
function pintar(){
  llenar("planta");llenar("fplanta");
  const est=$("estado"),sl=est.scrollLeft;
  if(!est._sc){est._sc=1;est.addEventListener("scroll",pintarPuntos,{passive:true})}
  est.innerHTML=S.plantas.map((p,i)=>{
    const r=ultimo(p,"Riego"),f=ultimo(p,"Fertilización"),u=S.ubic[p];
    return `<div class="pl ${r&&r[0]===hoy()?"hoy":""}" onclick="verPlanta(${i})"><div class="top"><div><b class="lk">${esc(p)}</b>${u?`<span class="mut" style="display:block">${esc(u)}</span>`:""}</div><button class="ic" onclick="event.stopPropagation();editarPlanta(${i})" title="Editar planta">✏️</button></div>${linea("💧","Último riego",r)}${linea("🧪","Último fertilizante",f)}<div class="mut" style="text-align:center;margin-top:6px">Toca para ver el calendario</div></div>`}).join("")||'<p class="mut">Aún no hay plantas.</p>';
  est.scrollLeft=sl;pintarPuntos();
  S.histOrd=[...S.regs].reverse().sort((a,b)=>b[0].localeCompare(a[0])).slice(0,30);
  $("hist").innerHTML=S.histOrd.map((r,i)=>
    `<div class="row"><div style="flex:1"><b>${esc(r[1])}</b> <span class="mut">${esc(r[2])}</span><div class="mut">${esc(r[3])}</div></div><div class="mut" style="text-align:right">${r[0]}<br>${esc(r[4])}</div><button class="ic" onclick="borrarReg(${i})" title="Borrar registro">🗑</button></div>`).join("")||'<p class="mut">Sin registros.</p>';
  S.ord=[...S.fotos].sort((a,b)=>b[0].localeCompare(a[0]));
  $("galeria").innerHTML=S.ord.map((r,i)=>
    `<div class="row"><div><b>${esc(r[1])}</b><div class="mut">${r[0]} · ${esc(r[3])}</div><div class="mut">${esc(r[4])}</div></div><button class="ver" onclick="verFoto(${i})">🖼</button></div>`).join("")||'<p class="mut">Sin fotos.</p>';
  if(PV!==null)pintarPlanta();
}
let PV=null,ASC=true;
const ICONOS={"Riego":"💧","Fertilización":"🧪","Poda":"✂️","Trasplante":"🪴","Plaga/tratamiento":"🐛","Observación":"📝","Foto":"📷"};
function verPlanta(i){const p=S.plantas[i];if(p===undefined)return;PV=p;ASC=true;CAL=null;SD=null;pintarPlanta();$("panel").hidden=false;$("panel").scrollTop=0;document.body.style.overflow="hidden"}
function cerrarPlanta(){PV=null;$("panel").hidden=true;document.body.style.overflow=""}
function invertir(){ASC=!ASC;pintarPlanta()}
let CAL=null,SD=null;
function calMes(d){CAL.m+=d;if(CAL.m<0){CAL.m=11;CAL.y--}else if(CAL.m>11){CAL.m=0;CAL.y++}SD=null;pintarPlanta()}
function selDia(iso){SD=SD===iso?null:iso;pintarPlanta()}
function calHTML(p){
  if(!CAL){const n=new Date();CAL={y:n.getFullYear(),m:n.getMonth()}}
  const pref=`${CAL.y}-${String(CAL.m+1).padStart(2,"0")}-`,rd=new Set(),fd=new Set();
  S.regs.forEach(r=>{if(r[1]===p&&r[0].startsWith(pref)){const d=+r[0].slice(8,10);if(r[2]==="Riego")rd.add(d);if(r[2]==="Fertilización")fd.add(d)}});
  const vacios=(new Date(CAL.y,CAL.m,1).getDay()+6)%7,total=new Date(CAL.y,CAL.m+1,0).getDate(),h=hoy();
  let c="LMXJVSD".split("").map(x=>`<div class="dw">${x}</div>`).join("")+"<div></div>".repeat(vacios);
  for(let k=1;k<=total;k++){const iso=pref+String(k).padStart(2,"0"),a=rd.has(k),b=fd.has(k);
    c+=`<div class="dia ${a&&b?"ab":a?"a":b?"b":""}${iso===h?" hoy":""}${iso===SD?" sel":""}" onclick="selDia('${iso}')">${k}</div>`}
  const det=SD?`<div class="mut" style="margin-bottom:4px">${fmt(SD)}</div>`+(S.regs.filter(r=>r[1]===p&&r[0]===SD).map(r=>
    `<div class="row"><div><b>${ICONOS[r[2]]||"•"} ${esc(r[2])}</b><div class="mut">${esc(r[3])}</div></div><div class="mut">${esc(r[4])}</div></div>`).join("")||'<p class="mut">Sin registros ese día.</p>')
    :'<p class="mut" style="margin:0">Toca un día para ver el detalle.</p>';
  const mes=new Date(CAL.y,CAL.m,1).toLocaleDateString("es",{month:"long",year:"numeric"});
  return `<div class="card"><h2>Calendario</h2><div class="mes"><button class="ic" onclick="calMes(-1)">‹</button><b>${mes}</b><button class="ic" onclick="calMes(1)">›</button></div><div class="cal">${c}</div>
  <div class="leg"><span><i style="background:#4a90d9"></i>Riego (${rd.size})</span><span><i style="background:#e0902f"></i>Fertilización (${fd.size})</span><span><i style="background:linear-gradient(135deg,#4a90d9 50%,#e0902f 50%)"></i>Ambos</span></div>
  <div style="margin-top:10px">${det}</div></div>`;
}
function pintarPlanta(){
  const p=PV;if(p===null)return;
  if(!S.plantas.includes(p))return cerrarPlanta();
  const ev=[...S.regs.filter(r=>r[1]===p).map((r,k)=>({f:r[0],k,t:r[2],d:r[3],q:r[4]})),
            ...S.fotos.filter(r=>r[1]===p).map((r,k)=>({f:r[0],k:1e6+k,t:"Foto",d:r[4],q:r[3],foto:r}))];
  ev.sort((a,b)=>a.f.localeCompare(b.f)||a.k-b.k);if(!ASC)ev.reverse();
  const n=t=>ev.filter(e=>e.t===t).length;
  $("pbody").innerHTML=`<div class="card"><h2>${esc(p)}</h2>${S.ubic[p]?`<p class="mut" style="margin:0 0 8px">${esc(S.ubic[p])}</p>`:""}
    <div class="mut">${n("Riego")} riegos · ${n("Fertilización")} fertilizaciones · ${n("Foto")} fotos · ${ev.length} eventos en total</div>
    <button class="s" onclick="invertir()">${ASC?"Orden: del más antiguo al más reciente ↓":"Orden: del más reciente al más antiguo ↑"}</button></div>
    ${calHTML(p)}<div class="card"><h2>Historial</h2>${ev.map(e=>`<div class="row"><div style="flex:1"><b>${ICONOS[e.t]||"•"} ${esc(e.t)}</b><div class="mut">${esc(e.d)}</div></div>
    <div class="mut" style="text-align:right">${fmt(e.f)}<br>${esc(e.q)}</div>${e.foto?`<button class="ver" onclick="verFoto(${S.ord.indexOf(e.foto)})">🖼</button>`:""}</div>`).join("")||'<p class="mut">Esta planta aún no tiene registros.</p>'}</div>`;
}
function montar(){
  $("app").innerHTML=`<section id="v1">
  <div class="card"><h2>Estado de las plantas</h2><div id="estado"></div><div id="dots"></div></div>
  <div class="card"><h2>Nuevo registro</h2>
   <label>Planta</label><select id="planta"></select>
   <label>Tipo de cuidado</label><select id="tipo">${TIPOS.map(t=>`<option>${t}</option>`).join("")}</select>
   <label>Fecha</label><input type="date" id="fecha" value="${hoy()}">
   <label>Detalle (ej. 500 ml)</label><input id="detalle">
   <button class="p" onclick="registrar()">Guardar en Excel</button>
   <button class="s" onclick="nuevaPlanta()">+ Nueva planta</button></div>
  <div class="card"><h2>Últimos registros</h2><div id="hist"></div></div></section>
  <section id="v2" hidden>
  <div class="card"><h2>Subir fotos</h2>
   <label>Planta</label><select id="fplanta"></select>
   <label>Nota (opcional)</label><input id="fnota">
   <label>Fotos</label><input type="file" id="archivos" accept="image/*" multiple>
   <button class="p" onclick="subir()">📷 Subir fotos</button></div>
  <div class="card"><h2>Galería</h2><p class="mut">Toca 🖼 para ver la foto.</p><div id="galeria"></div></div></section>`;
}
function tab(n){$("v1").hidden=n!==1;$("v2").hidden=n!==2;$("t1").className=n===1?"on":"";$("t2").className=n===2?"on":""}

/* ---------- acciones ---------- */
function registrar(){
  const p=$("planta").value,tipo=$("tipo").value,fecha=$("fecha").value,det=$("detalle").value.trim();
  if(!p||!fecha)return aviso("Elige planta y fecha",true);
  let conf=false;
  if(tipo==="Riego"){const u=ultimo(p,"Riego");
    if(u&&u[0]===fecha){if(!confirm(`${p} ya fue regada ese día${u[4]?" por "+u[4]:""}.\n¿Registrar otro riego?`))return;conf=true}}
  S.regs.push([fecha,p,tipo,det,QUIEN]);pintar();$("detalle").value="";
  enSegundoPlano("Guardando…",async()=>{
    let cancel=false;
    const wb=await modificar(w=>{
      if(tipo==="Riego"&&!conf){
        const u=filasWb(w,"Registros").filter(x=>x[1]===p&&x[2]==="Riego"&&x[0]===fecha).pop();
        if(u){if(!confirm(`${p} ya fue regada ese día${u[4]?" por "+u[4]:""}.\n¿Registrar otro riego?`)){cancel=true;return false}conf=true}}
      anexar(w,"Registros",[fecha,p,tipo,det,QUIEN]);
    });
    if(cancel){await cargar(true,true);return "Cancelado"}
    aplicar(wb);
  });
}
function nuevaPlanta(){
  const n=(prompt("Nombre de la planta:")||"").trim();if(!n)return;
  if(S.plantas.includes(n))return aviso("Esa planta ya existe",true);
  const u=(prompt("Ubicación (opcional):")||"").trim();
  S.plantas.push(n);S.ubic[n]=u;pintar();$("planta").value=n;$("fplanta").value=n;
  enSegundoPlano("Guardando…",async()=>aplicar(await modificar(w=>anexar(w,"Plantas",[n,u,""]))));
}
function editarPlanta(i){
  const v=S.plantas[i];if(v===undefined)return;
  const n=(prompt("Nombre de la planta:",v)||"").trim();if(!n)return;
  const u0=S.ubic[v]||"",u=prompt("Ubicación (opcional):",u0);if(u===null)return;
  const ub=u.trim();
  if(n===v&&ub===u0)return;
  if(n!==v&&S.plantas.includes(n))return aviso("Ya existe una planta con ese nombre",true);
  S.plantas[i]=n;S.ubic[n]=ub;if(n!==v)delete S.ubic[v];
  S.regs.forEach(r=>{if(r[1]===v)r[1]=n});S.fotos.forEach(r=>{if(r[1]===v)r[1]=n});pintar();
  enSegundoPlano("Guardando cambios…",async()=>aplicar(await modificar(w=>{renombrar(w,v,n,ub)})));
}
function borrarReg(i){
  const r=S.histOrd[i];if(!r)return;
  if(!confirm(`¿Borrar este registro?\n${r[1]} · ${r[2]} · ${r[0]}${r[3]?"\n"+r[3]:""}`))return;
  S.regs=S.regs.filter(x=>x!==r);pintar();
  enSegundoPlano("Borrando…",async()=>aplicar(await modificar(w=>eliminarFila(w.Sheets.Registros,r))));
}
function reducir(file){return new Promise((ok,err)=>{const img=new Image();
  img.onload=()=>{const k=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement("canvas");
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(img.src);c.toBlob(b=>b?ok(b):err(new Error("No se pudo procesar la foto")),"image/jpeg",.85)};
  img.onerror=()=>err(new Error("Formato de imagen no compatible"));img.src=URL.createObjectURL(file)})}
async function subirArchivo(nombre,blob){
  const url=`${P(CONFIG.FOTOS+"/"+nombre)}:/content`,o={method:"PUT",headers:{"Content-Type":"image/jpeg"},body:blob};
  try{await gf(url,o)}catch(e){if(e.status!==404)throw e;
    await gf(CH(),{method:"POST",headers:J,
      body:JSON.stringify({name:CONFIG.FOTOS,folder:{},"@microsoft.graph.conflictBehavior":"fail"})});
    await gf(url,o)}
}
function subir(){
  const p=$("fplanta").value,fs=[...$("archivos").files];
  if(!p)return aviso("Elige la planta",true);if(!fs.length)return aviso("Elige al menos una foto",true);
  const nota=$("fnota").value.trim(),fecha=hoy();
  $("archivos").value="";$("fnota").value="";
  enSegundoPlano(`Subiendo ${fs.length} foto(s)…`,async()=>{
    const nuevas=await Promise.all(fs.map(async f=>{
      const b=await reducir(f),nombre=`${fecha}_${limpio(p)}_${Math.random().toString(16).slice(2,8)}.jpg`;
      await subirArchivo(nombre,b);return [fecha,p,nombre,QUIEN,nota]}));
    aplicar(await modificar(w=>{nuevas.forEach(x=>anexar(w,"Fotos",x))}));
    return `${nuevas.length} foto(s) subida(s) ✓`;
  });
}
function verFoto(i){
  const f=S.ord[i];
  run(async()=>{
    let it;try{it=await(await gf(P(CONFIG.FOTOS+"/"+f[2]))).json()}
    catch(e){throw e.status===404?new Error("La foto aún no llega a OneDrive. Prueba en unos minutos."):e}
    const m=$("modal");m.innerHTML=`<img src="${it["@microsoft.graph.downloadUrl"]}"><p>${esc(f[1])} · ${f[0]}${f[3]?" · "+esc(f[3]):""}<br>${esc(f[4])}</p><p class="mut">Toca para cerrar</p>`;
    m.style.display="flex";$("msg").style.display="none"});
}
function salir(){msalApp.logoutRedirect({account})}

/* ---------- inicio ---------- */
function tarjeta(html){$("app").innerHTML=`<div class="card">${html}</div>`}
function iniciar(){
  try{QUIEN=localStorage.getItem("quien")||""}catch{}
  if(!QUIEN){QUIEN=(prompt("¿Cómo te llamas? (aparecerá en tus registros)")||account.name||"").trim();try{localStorage.setItem("quien",QUIEN)}catch{}}
  let m=null;try{m=JSON.parse(localStorage.getItem("origen")||"null")}catch{}
  if(!m)return pantallaOrigen();
  REF=m.ref||null;arrancar();
}
function arrancar(){
  ["b1","b2","b3","nav"].forEach(i=>$(i).hidden=false);montar();cargarCache();cargar();
  setInterval(()=>{if(!document.hidden)cargar(true)},30000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)cargar(true)});
}
function pantallaOrigen(){
  tarjeta(`<h2>¿De quién es el Excel?</h2>
  <p class="mut">Elige según la cuenta con la que iniciaste sesión.</p>
  <button class="p" onclick="origenPropio()">El Excel está en MI OneDrive</button>
  <label style="margin-top:18px">O pega el enlace de la carpeta que te compartieron</label>
  <input id="enlace" placeholder="https://1drv.ms/...">
  <button class="s" onclick="origenCompartido()">Usar la carpeta compartida</button>`);
}
function origenPropio(){try{localStorage.setItem("origen","{}")}catch{}REF=null;arrancar()}
async function origenCompartido(){
  const u=$("enlace").value.trim();if(!u)return aviso("Pega primero el enlace",true);
  aviso("Comprobando enlace…");
  try{const it=await(await gf(`/shares/${shareId(u)}/driveItem`)).json();
    const ref={d:it.parentReference.driveId,i:it.id};
    try{localStorage.setItem("origen",JSON.stringify({ref}))}catch{}
    REF=ref;$("msg").style.display="none";arrancar();
  }catch(e){aviso("No se pudo abrir el enlace: "+e.message,true)}
}
function cambiarOrigen(){if(confirm("¿Cambiar de dónde se lee el Excel?")){try{localStorage.removeItem("origen")}catch{}location.reload()}}
(async()=>{
  if(location.protocol==="file:")return tarjeta("<h2>Falta alojar la página</h2><p>Esta página debe abrirse desde su dirección web (https), no como archivo.</p>");
  if(CONFIG.CLIENT_ID.startsWith("PEGA"))return tarjeta("<h2>Falta configurar</h2><p>Abre index.html y pega el ID de tu aplicación de Microsoft en CLIENT_ID.</p>");
  try{
    msalApp=new msal.PublicClientApplication({auth:{clientId:CONFIG.CLIENT_ID,authority:"https://login.microsoftonline.com/consumers",
      redirectUri:location.origin+location.pathname},cache:{cacheLocation:"localStorage"}});
    if(msalApp.initialize)await msalApp.initialize();
    const r=await msalApp.handleRedirectPromise();account=r?r.account:msalApp.getAllAccounts()[0];
  }catch(e){return tarjeta("<h2>Error de inicio</h2><p>"+esc(e.message)+"</p>")}
  if(account)iniciar();
  else{tarjeta('<h2>Bienvenido</h2><p>Inicia sesión con tu cuenta de Microsoft (la de tu OneDrive).</p><button class="p" onclick="msalApp.loginRedirect({scopes:SCOPES})">Iniciar sesión con Microsoft</button>')}
})();
</script></body></html>
